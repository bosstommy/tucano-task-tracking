<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tucano.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF7F0" />
    <title>TUCANO</title>
    <script>
      try {
        var t = localStorage.getItem('tucano-theme');
        var sc = Number(localStorage.getItem('tucano-scale')) || 130;
        document.documentElement.style.setProperty('--ui-font', sc + '%');
        document.documentElement.style.setProperty('--ui-zoom', String(sc / 100));
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
